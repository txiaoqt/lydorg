<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Placeholder key art for the Youth Organization Registration Program">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#050A1E"/>
      <stop offset="55%" stop-color="#0B1638"/>
      <stop offset="100%" stop-color="#1B1140"/>
    </linearGradient>
    <radialGradient id="gateGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="35%" stop-color="#7DD3FC"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- distant ridgeline -->
  <path d="M0 430 L180 392 L300 418 L430 360 L560 404 L690 366 L820 410 L960 372 L1100 414 L1240 378 L1380 412 L1520 384 L1600 406 L1600 600 L0 600 Z" fill="#0A1330" opacity="0.9"/>
  <path d="M0 470 L200 448 L360 468 L520 440 L700 470 L880 444 L1060 472 L1240 448 L1420 470 L1600 452 L1600 600 L0 600 Z" fill="#070D22"/>

  <!-- gate halo -->
  <ellipse cx="800" cy="300" rx="330" ry="290" fill="url(#gateGlow)" opacity="0.5" filter="url(#soft)"/>

  <!-- the gate -->
  <path d="M640 470 L640 250 A160 160 0 0 1 960 250 L960 470 Z" fill="url(#portal)" opacity="0.18" filter="url(#tight)"/>
  <path d="M660 470 L660 250 A140 140 0 0 1 940 250 L940 470" fill="none" stroke="#BAE6FD" stroke-width="7" opacity="0.95"/>
  <path d="M690 470 L690 254 A110 110 0 0 1 910 254 L910 470" fill="none" stroke="#7DD3FC" stroke-width="2.5" opacity="0.75"/>
  <path d="M660 470 L660 250 A140 140 0 0 1 940 250 L940 470" fill="none" stroke="#38BDF8" stroke-width="18" opacity="0.35" filter="url(#soft)"/>

  <!-- runes around the arch -->
  <g fill="#E0F2FE" opacity="0.9">
    <rect x="648" y="330" width="10" height="10" transform="rotate(45 653 335)"/>
    <rect x="648" y="392" width="8" height="8" transform="rotate(45 652 396)"/>
    <rect x="942" y="330" width="10" height="10" transform="rotate(45 947 335)"/>
    <rect x="942" y="392" width="8" height="8" transform="rotate(45 946 396)"/>
    <rect x="742" y="118" width="9" height="9" transform="rotate(45 746 122)"/>
    <rect x="848" y="118" width="9" height="9" transform="rotate(45 852 122)"/>
    <rect x="795" y="92" width="12" height="12" transform="rotate(45 801 98)"/>
  </g>

  <!-- light spill on the floor -->
  <path d="M560 600 L1040 600 L900 470 L700 470 Z" fill="url(#floor)" opacity="0.5"/>

  <!-- lone silhouette -->
  <g fill="#03060F">
    <circle cx="470" cy="392" r="20"/>
    <path d="M470 414 c-26 0 -42 20 -46 46 l-8 60 h108 l-8 -60 c-4 -26 -20 -46 -46 -46 z"/>
    <path d="M424 470 l-26 52 18 8 24 -46 z"/>
    <path d="M516 470 l26 52 -18 8 -24 -46 z"/>
  </g>

  <!-- drifting motes -->
  <g fill="#BAE6FD">
    <circle cx="1180" cy="210" r="3" opacity="0.8"/>
    <circle cx="1260" cy="300" r="2" opacity="0.6"/>
    <circle cx="1100" cy="360" r="2.5" opacity="0.7"/>
    <circle cx="360" cy="250" r="2" opacity="0.5"/>
    <circle cx="300" cy="330" r="3" opacity="0.4"/>
    <circle cx="1330" cy="400" r="2" opacity="0.5"/>
  </g>
</svg>
