<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Placeholder key art for the Youth Participation Organization Passport">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#07040F"/>
      <stop offset="50%" stop-color="#150A2E"/>
      <stop offset="100%" stop-color="#0A1030"/>
    </linearGradient>
    <radialGradient id="crestGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowTight" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg2)"/>

  <!-- shadow tendrils -->
  <g fill="#0B0620" opacity="0.95">
    <path d="M0 600 C220 470 320 520 420 600 Z"/>
    <path d="M1600 600 C1380 460 1260 520 1160 600 Z"/>
    <path d="M0 600 C420 520 640 560 800 600 Z"/>
    <path d="M1600 600 C1180 520 960 560 800 600 Z"/>
  </g>

  <!-- aura -->
  <ellipse cx="800" cy="300" rx="300" ry="270" fill="url(#crestGlow)" opacity="0.55" filter="url(#glow2)"/>

  <!-- crest ring -->
  <circle cx="800" cy="290" r="176" fill="none" stroke="#A78BFA" stroke-width="3" opacity="0.75"/>
  <circle cx="800" cy="290" r="150" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.55"/>
  <circle cx="800" cy="290" r="176" fill="none" stroke="#C4B5FD" stroke-width="14" opacity="0.3" filter="url(#glowTight)"/>

  <!-- crown -->
  <path d="M712 250 L738 292 L800 236 L862 292 L888 250 L872 330 L728 330 Z" fill="url(#crest)" opacity="0.95"/>
  <path d="M728 330 L872 330 L856 352 L744 352 Z" fill="#A78BFA" opacity="0.85"/>

  <!-- wings / laurel -->
  <path d="M624 290 C660 236 700 214 742 208" fill="none" stroke="#C4B5FD" stroke-width="3" opacity="0.7"/>
  <path d="M976 290 C940 236 900 214 858 208" fill="none" stroke="#C4B5FD" stroke-width="3" opacity="0.7"/>
  <path d="M624 300 C664 348 706 366 748 372" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
  <path d="M976 300 C936 348 894 366 852 372" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>

  <!-- energy wisps -->
  <path d="M120 330 C360 250 560 300 700 280" fill="none" stroke="url(#wisp)" stroke-width="4" opacity="0.6"/>
  <path d="M1480 340 C1240 260 1040 310 900 290" fill="none" stroke="url(#wisp)" stroke-width="4" opacity="0.6"/>
  <path d="M200 470 C420 400 600 440 720 420" fill="none" stroke="url(#wisp)" stroke-width="2.5" opacity="0.4"/>
  <path d="M1400 470 C1180 400 1000 440 880 420" fill="none" stroke="url(#wisp)" stroke-width="2.5" opacity="0.4"/>

  <!-- floating shards -->
  <g fill="#C4B5FD" opacity="0.85">
    <rect x="1120" y="150" width="9" height="9" transform="rotate(45 1124 154)"/>
    <rect x="466" y="168" width="7" height="7" transform="rotate(45 469 171)"/>
    <rect x="1260" y="392" width="11" height="11" transform="rotate(45 1265 397)"/>
    <rect x="330" y="392" width="8" height="8" transform="rotate(45 334 396)"/>
    <rect x="800" y="96" width="10" height="10" transform="rotate(45 805 101)"/>
  </g>

  <g fill="#7C3AED" opacity="0.5">
    <circle cx="240" cy="220" r="3"/>
    <circle cx="1360" cy="240" r="2.5"/>
    <circle cx="1180" cy="470" r="2"/>
    <circle cx="420" cy="470" r="2"/>
  </g>
</svg>
