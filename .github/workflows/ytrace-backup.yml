name: Y-TRACE manual backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytrace-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate backup code with local mocks
        run: node --test scripts/backup/backup.test.mjs
      - name: Check runner backup tooling
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          command -v aws >/dev/null
          docker info >/dev/null 2>&1
      - name: Back up database and Storage, verify, package and upload to R2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module -e "import { validateSecrets } from './scripts/backup/common.mjs'; validateSecrets(process.env)"
          export YTRACE_BACKUP_TEMP
          YTRACE_BACKUP_TEMP=$(mktemp -d "$RUNNER_TEMP/ytrace-backup.XXXXXXXX")
          printf 'YTRACE_BACKUP_TEMP=%s\n' "$YTRACE_BACKUP_TEMP" >> "$GITHUB_ENV"
          node scripts/backup/run-backup.mjs
      - name: Clean temporary backup data on success or failure
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${YTRACE_BACKUP_TEMP:-}" ]]; then
            case "$YTRACE_BACKUP_TEMP" in
              "$RUNNER_TEMP"/ytrace-backup.*) rm -rf -- "$YTRACE_BACKUP_TEMP" ;;
              *) printf 'Refusing unsafe cleanup path\n' >&2; exit 1 ;;
            esac
          fi
